[theme]
primaryColor = "#1889d5"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f7fb"
textColor = "#203347"
font = "sans serif"

[client]
# Uncaught errors show only their type in the browser; messages and tracebacks stay in the server log.
showErrorDetails = "type"

[server]
maxUploadSize = 5
enableXsrfProtection = true
enableCORS = true
